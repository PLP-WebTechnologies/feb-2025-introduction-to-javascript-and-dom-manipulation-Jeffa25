<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOM Interaction Example</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 id="main-title">Welcome to My Page</h1>
  </header>

  <main>
    <section>
      <p id="intro">This is an introductory paragraph.</p>
      <button id="change-text">Change Text</button>
    </section>

    <section>
      <button id="change-style">Change Style</button>
    </section>

    <section>
      <button id="add-element">Add Element</button>
      <button id="remove-element">Remove Element</button>
      <div id="container"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 My Page</p>
  </footer>

  <script src="script.js"></script>

</html>
